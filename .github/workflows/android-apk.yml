name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android shell
        run: flutter create --platforms=android --project-name turnopronto_app --org br.com.turnopronto .

      - name: Allow local HTTP for test APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = s.replace('android:label="turnopronto_app"', 'android:label="TurnoPronto"')
          p.write_text(s)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build debug APK
        env:
          API_URL: ${{ vars.API_URL || 'https://turnopronto1.websiteseguro.com/api/v1' }}
        run: flutter build apk --debug --dart-define=API_URL="$API_URL"

      - name: Prepare artifact
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk build/TurnoPronto-test.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/TurnoPronto-latest.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/TurnoPronto.apk

      - name: Publish stable test download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f test-latest
          git push origin -f test-latest

          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest build/TurnoPronto.apk --clobber
            gh release edit test-latest \
              --title "TurnoPronto Android - versão de teste" \
              --notes "APK de teste mais recente do TurnoPronto. Gerado automaticamente a partir do branch main." \
              --prerelease
          else
            gh release create test-latest build/TurnoPronto.apk \
              --title "TurnoPronto Android - versão de teste" \
              --notes "APK de teste mais recente do TurnoPronto. Gerado automaticamente a partir do branch main." \
              --prerelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurnoPronto-APK
          path: |
            build/TurnoPronto-test.apk
            build/TurnoPronto-latest.apk
          if-no-files-found: error
          retention-days: 30
