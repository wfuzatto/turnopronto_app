name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android shell
        run: flutter create --platforms=android --project-name turnopronto_app --org br.com.turnopronto .

      - name: Set Android identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace('android:label="turnopronto_app"', 'android:label="TurnoPronto"')
          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          text = text.replace(
              'applicationId = "br.com.turnopronto.turnopronto_app"',
              'applicationId = "br.com.turnopronto.turnopronto_app"',
          )
          gradle.write_text(text)
          PY

          grep -q 'applicationId = "br.com.turnopronto.turnopronto_app"' android/app/build.gradle.kts

      - name: Configure persistent Android signing
        shell: bash
        run: |
          set -euo pipefail

          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "Missing required GitHub Actions secret: $value" >&2
              echo "A stable signing key is required so a new APK can update the installed TurnoPronto app." >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/turnopronto-upload.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=turnopronto-upload.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          imports = "import java.util.Properties\nimport java.io.FileInputStream\n\n"
          if "import java.util.Properties" not in s:
              s = imports + s

          props = """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(FileInputStream(keystorePropertiesFile))

          """
          if "val keystoreProperties = Properties()" not in s:
              s = s.replace("android {", props + "android {", 1)

          signing = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
          if 'create("release")' not in s:
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )

          p.write_text(s)
          PY

          keytool -list             -keystore android/app/turnopronto-upload.jks             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

          grep -q 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release             --build-name="0.1.${GITHUB_RUN_NUMBER}"             --build-number="${GITHUB_RUN_NUMBER}"

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" build/TurnoPronto-test.apk
          cp "$APK" build/TurnoPronto-latest.apk
          cp "$APK" build/TurnoPronto.apk

      - name: Publish stable test download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f test-latest
          git push origin -f test-latest

          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest build/TurnoPronto.apk --clobber
            gh release edit test-latest               --title "TurnoPronto Android - versão de teste"               --notes "APK Android assinado do TurnoPronto. Mantém o mesmo applicationId e usa versionCode crescente para permitir atualização sobre versões futuras assinadas pela mesma chave."               --prerelease
          else
            gh release create test-latest build/TurnoPronto.apk               --title "TurnoPronto Android - versão de teste"               --notes "APK Android assinado do TurnoPronto. Mantém o mesmo applicationId e usa versionCode crescente para permitir atualização sobre versões futuras assinadas pela mesma chave."               --prerelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurnoPronto-APK
          path: |
            build/TurnoPronto-test.apk
            build/TurnoPronto-latest.apk
          if-no-files-found: error
          retention-days: 30
